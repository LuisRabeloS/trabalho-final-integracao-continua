
name: 'Super pipeline'

on:
    workflow_dispatch:
    push:
        branches:
            - master
    schedule:
        - cron: '0 1 * * *'        

jobs: 
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - uses: actions/setup-node@v4
              with: 
                node-version: 24.x

            - name: Instalando dependências do node
              run: npm install       
              
            - name: Executando testes de unidade
              run: npm test  

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                name: report
                path: mochawesome-report/  